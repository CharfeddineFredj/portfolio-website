<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <title>PulseFit - mobile app mockup</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07070d"/>
      <stop offset="0.5" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#2e1065"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#ffffff" fill-opacity="0.10"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#dots)"/>
  <circle cx="1180" cy="430" r="460" fill="url(#glow)"/>

  <g font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
    <g filter="url(#shadow)">
      <rect x="150" y="280" width="440" height="210" rx="28" fill="#14142b" stroke="#2a2a4a" stroke-width="2"/>
      <text x="186" y="326" font-size="22" fill="#94a3b8">Heart rate</text>
      <text x="186" y="378" font-size="40" font-weight="700" fill="#ffffff">128 bpm</text>
      <path d="M186 432 L226 432 L246 404 L266 456 L286 420 L312 432 L462 432 L482 396 L502 462 L522 432 L554 432" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>
    </g>

    <g filter="url(#shadow)">
      <rect x="150" y="520" width="440" height="130" rx="28" fill="#14142b" stroke="#2a2a4a" stroke-width="2"/>
      <text x="186" y="566" font-size="22" fill="#94a3b8">Personal record</text>
      <text x="186" y="612" font-size="30" font-weight="700" fill="#ffffff">Bench press - 80 kg</text>
      <circle cx="546" cy="582" r="26" fill="#facc15"/>
      <text x="546" y="589" font-size="18" font-weight="700" fill="#0b0b14" text-anchor="middle">PR</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="260" y="686" width="340" height="92" rx="46" fill="url(#accent)"/>
      <text x="300" y="742" font-size="28" font-weight="700" fill="#0b0b14">7-day streak</text>
    </g>
  </g>

  <rect x="960" y="70" width="430" height="860" rx="58" fill="#0b0b14" filter="url(#shadow)"/>
  <rect x="960" y="70" width="430" height="860" rx="58" fill="none" stroke="#334155" stroke-width="3"/>
  <rect x="974" y="84" width="402" height="832" rx="46" fill="#0f0f1d"/>
  <rect x="1130" y="96" width="120" height="34" rx="17" fill="#0b0b14"/>

  <g font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
    <text x="1010" y="130" font-size="22" font-weight="600" fill="#e2e8f0">9:41</text>
    <text x="1010" y="192" font-size="20" fill="#94a3b8">Today</text>
    <text x="1010" y="236" font-size="36" font-weight="700" fill="#ffffff">Workout</text>

    <rect x="1000" y="262" width="362" height="236" rx="28" fill="#171729"/>
    <circle cx="1098" cy="380" r="78" fill="none" stroke="#262642" stroke-width="16"/>
    <circle cx="1098" cy="380" r="78" fill="none" stroke="url(#accent)" stroke-width="16" stroke-linecap="round" stroke-dasharray="353 490" transform="rotate(-90 1098 380)"/>
    <text x="1098" y="392" font-size="38" font-weight="700" fill="#ffffff" text-anchor="middle">72%</text>
    <text x="1098" y="418" font-size="18" fill="#94a3b8" text-anchor="middle">Done</text>
    <text x="1206" y="352" font-size="26" font-weight="700" fill="#ffffff">Upper body</text>
    <text x="1206" y="388" font-size="20" fill="#94a3b8">4 / 6 done</text>
    <text x="1206" y="424" font-size="20" fill="#22d3ee">Next: Pull-ups</text>

    <rect x="1000" y="516" width="114" height="124" rx="22" fill="#171729"/>
    <text x="1016" y="554" font-size="18" fill="#94a3b8">Steps</text>
    <text x="1016" y="600" font-size="32" font-weight="700" fill="#ffffff">8.2k</text>
    <rect x="1124" y="516" width="114" height="124" rx="22" fill="#171729"/>
    <text x="1140" y="554" font-size="18" fill="#94a3b8">Kcal</text>
    <text x="1140" y="600" font-size="32" font-weight="700" fill="#ffffff">540</text>
    <rect x="1248" y="516" width="114" height="124" rx="22" fill="#171729"/>
    <text x="1264" y="554" font-size="18" fill="#94a3b8">Active</text>
    <text x="1264" y="600" font-size="32" font-weight="700" fill="#ffffff">45m</text>

    <rect x="1000" y="656" width="362" height="160" rx="24" fill="#171729"/>
    <text x="1020" y="690" font-size="20" fill="#94a3b8">This week</text>
    <rect x="1024" y="756" width="28" height="44" rx="8" fill="url(#accent)"/>
    <rect x="1068" y="734" width="28" height="66" rx="8" fill="url(#accent)"/>
    <rect x="1112" y="748" width="28" height="52" rx="8" fill="url(#accent)"/>
    <rect x="1156" y="716" width="28" height="84" rx="8" fill="url(#accent)"/>
    <rect x="1200" y="740" width="28" height="60" rx="8" fill="url(#accent)"/>
    <rect x="1244" y="704" width="28" height="96" rx="8" fill="url(#accent)"/>
    <rect x="1288" y="730" width="28" height="70" rx="8" fill="url(#accent)"/>

    <rect x="1000" y="834" width="362" height="54" rx="27" fill="url(#accent)"/>
    <text x="1181" y="868" font-size="22" font-weight="700" fill="#0b0b14" text-anchor="middle">Start workout</text>
  </g>
</svg>
