      <circle cx="240" cy="530" r="52" fill="none" stroke="#e2e8f0" stroke-width="14"/>
      <circle cx="240" cy="530" r="52" fill="none" stroke="url(#accent)" stroke-width="14" stroke-linecap="round" stroke-dasharray="307 327" transform="rotate(-90 240 530)"/>
      <text x="240" y="539" font-size="26" font-weight="700" fill="#0f172a" text-anchor="middle">94%</text>
      <text x="330" y="515" font-size="20" fill="#64748b">Attendance</text>
      <text x="330" y="552" font-size="24" font-weight="700" fill="#0f172a">On track</text>
    </g>

    <g filter="url(#shadow)">
      <rect x="250" y="680" width="420" height="112" rx="28" fill="#0f172a"/>
      <circle cx="286" cy="736" r="9" fill="#34d399"/>
      <text x="310" y="744" font-size="26" font-weight="700" fill="#ffffff">3 new course updates</text>
      <text x="310" y="774" font-size="20" fill="#94a3b8">Tap to review</text>
    </g>
