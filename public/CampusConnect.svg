    <text x="1040" y="408" font-size="26" font-weight="700" fill="#0f172a">Software Architecture</text>
    <text x="1040" y="436" font-size="20" fill="#475569">Room B12 - Lecture</text>

    <rect x="1000" y="462" width="362" height="110" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="1016" y="484" width="6" height="66" rx="3" fill="#8b5cf6"/>
    <text x="1040" y="496" font-size="20" fill="#64748b">11:00 - 12:30</text>
    <text x="1040" y="530" font-size="26" font-weight="700" fill="#0f172a">Database Systems</text>
    <text x="1040" y="558" font-size="20" fill="#475569">Lab 3 - Practical</text>

    <rect x="1000" y="584" width="362" height="110" rx="22" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="1016" y="606" width="6" height="66" rx="3" fill="#14b8a6"/>
