<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <title>Campus Connect - mobile app mockup</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="0.55" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0e7490"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#ffffff" fill-opacity="0.12"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#bg)"/>
  <rect width="1600" height="1000" fill="url(#dots)"/>
  <circle cx="1180" cy="430" r="460" fill="url(#glow)"/>

  <g font-family="Inter, 'Segoe UI', Roboto, Arial, sans-serif">
    <g filter="url(#shadow)">
      <rect x="150" y="260" width="460" height="140" rx="26" fill="#ffffff"/>
      <circle cx="206" cy="330" r="34" fill="url(#accent)"/>
      <path d="M190 330 L201 341 L223 317" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="262" y="312" font-size="22" fill="#64748b">Next class</text>
      <text x="262" y="350" font-size="26" font-weight="700" fill="#0f172a">Software Architecture</text>
      <text x="262" y="382" font-size="20" fill="#475569">In 25 min - Room B12</text>
    </g>

    <g filter="url(#shadow)">
