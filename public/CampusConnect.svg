    <text x="1032" y="740" font-size="16" font-weight="700" fill="#4f46e5" letter-spacing="1.5">ANNOUNCEMENT</text>
    <text x="1032" y="772" font-size="24" font-weight="700" fill="#0f172a">Exam schedule published</text>
